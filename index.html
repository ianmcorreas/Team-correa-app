 for(const [b,paths] of Object.entries(by)){try{const {data}=await sb.storage.from(b).createSignedUrls(paths,604800);(data||[]).forEach(x=>{if(x.signedUrl){const k="sb:"+b+"/"+x.path;map.set(k,x.signedUrl);SIGNED.set(x.signedUrl,k)}})}catch(_){}}

   <main className={"max-w-2xl mx-auto px-5 "+"py-8 "+(role==="a"?"pb-32 md:pb-12":"pb-12")}>{false&&<div className="flex items-center gap-2.5 mb-6"><img src={MARK} alt="" className="h-9"/><span className="leading-none"><span className="block text-[15px] font-semibold tracking-[0.08em]" style={{fontFamily:"Sora,sans-serif"}}>TEAM CORRÊA</span><span className="block text-[8px] tracking-[0.34em] text-[#E04458] mt-1">CONSULTORIA ONLINE</span></span></div>}{role==="t"?<Trainer db={dbT} set={set} tab={tab} toast={toast} setTab={setTab}/>:wait?<Waiting st={stA}/>:!stA?<p className="text-sm text-[#8a8a93] text-center mt-16">Nenhuma aluna cadastrada ainda.<br/>Use o botão + na aba Alunas.</p>:<Student key={sid} sid={sid} setSid={auth.role==="t"?setSid:null} db={dbe} set={set} tab={tab} toast={toast} setTab={setTab} fgo={fgo} openN={()=>setNA(true)} nN={nl.length} simDay={simDay} logout={logout}/>}</main></div>
  {role==="a"&&!wait&&<nav className="md:hidden fixed bottom-0 inset-x-0 z-30 px-4 pb-3 pointer-events-none" style={{paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 12px)"}}><div className="pointer-events-auto flex bg-[#212126]/95 backdrop-blur border border-[#303036] rounded-[30px] p-2 gap-1 shadow-[0_12px_32px_-10px_rgba(0,0,0,.95)]">
   {tabs.map(([k,i,l])=><button key={k} onClick={()=>setTab(k)} className={"flex-1 py-2.5 rounded-[22px] flex flex-col items-center gap-1 text-[11px] font-medium "+(at===k?"bg-[#8E0000]/30 text-[#ff8a99]":"text-[#a1a1aa]")}><Ic n={i} s={21}/>{l}</button>)}</div></nav>}
  {mOpen&&<div className="fixed inset-0 z-[60]"><div className="absolute inset-0 bg-black/60" onClick={()=>setMOpen(false)}/>
   <div className="absolute left-0 top-0 bottom-0 w-72 max-w-[82%] bg-[#212126] border-r border-[#36363d] p-5 flex flex-col" style={{animation:"fi .2s ease both"}}>
    <div className="flex items-center justify-between"><img src={LOGO} alt="Team Corrêa" className="w-28"/><button aria-label="Fechar menu" onClick={()=>setMOpen(false)} className="w-9 h-9 rounded-full flex items-center justify-center text-[#a1a1aa] hover:bg-[#2c2c32]"><Ic n="X" s={20}/></button></div>
    <nav className="mt-6 space-y-1.5">{tabs.map(([k,i,l,d])=><button key={k} onClick={()=>{setTab(k);setMOpen(false)}} className={"w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-left "+(at===k?"bg-gradient-to-br from-[#B3122A] to-[#8E0000] text-white glow":"text-[#d4d4d8] hover:bg-[#2c2c32]")}><Ic n={i} s={20}/><span><span className="block text-[15px] font-medium leading-tight">{l}</span><span className={"block text-[11px] mt-0.5 "+(at===k?"text-white/75":"text-[#8a8a93]")}>{d}</span></span></button>)}</nav></div></div>}
  {nA&&<Modal onClose={()=>setNA(false)}><div className="flex items-center justify-between mb-3"><div className="text-lg font-semibold">Notificações</div><button aria-label="Fechar" onClick={()=>setNA(false)} className="text-[#71717A]"><Ic n="X" s={18}/></button></div>
   {nl.length===0&&<p className="text-sm text-[#71717A] text-center py-6">Tudo em dia por aqui.</p>}
   <div className="divide-y divide-[#303036]">{nl.map(n=><div key={n.id} className="py-3 flex items-center gap-3"><span className="w-10 h-10 shrink-0 rounded-full bg-[#8E0000]/20 text-[#E04458] flex items-center justify-center"><Ic n={n.i} s={18}/></span><div className="flex-1 min-w-0"><div className="text-sm font-medium">{n.t}</div><div className="text-xs text-[#a1a1aa] mt-0.5">{n.d}</div></div><Btn className="!py-1.5 !px-3 text-xs shrink-0" onClick={()=>{setNA(false);if(n.k)setFgo({k:n.k,t:Date.now()});setTab(n.to)}}>{n.b}</Btn></div>)}</div></Modal>}
  {msg&&<div className="fixed left-1/2 -translate-x-1/2 bottom-28 md:bottom-8 z-50 bg-[#212126] border border-[#8E0000] glow text-sm px-4 py-2.5 rounded-full whitespace-nowrap">{msg}</div>}
 </div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
