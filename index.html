const PW={Mensal:4,Trimestral:12,Semestral:24};
let TODAY=REAL?(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})():new Date(2026,10,20);
const dt=(iso,add=0)=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d+add)};
const fd=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtT=t=>{const h=Math.floor(t/3600),m=String(Math.floor(t%3600/60)).padStart(2,"0"),x=String(t%60).padStart(2,"0");return h>0?`${h}:${m}:${x}`:`${m}:${x}`};
const fmtK=v=>String(v).replace(".",",");
const monOf=d=>dt(iso(d),-((d.getDay()+6)%7));
const addBD=(d,n)=>{let x=d;while(n>0){x=dt(iso(x),1);if(x.getDay()%6)n--}return x};

 const pad=dbe.students.filter(s=>db.w[s.id]&&Object.values(db.w[s.id]).some(v=>v.some(e=>e.hist.length<cwm[s.id]))).map(s=>s.id).join(",");
 useEffect(()=>{if(!due&&!pad)return;set(d=>{let a=d;due.split(",").filter(Boolean).forEach(i=>{a=applyNext(a,+i,cwm[i])});

   {tabs.map(([k,i,l])=><button key={k} onClick={()=>setTab(k)} className={"flex-1 py-2.5 rounded-[22px] flex flex-col items-center gap-1 text-[11px] font-medium "+(at===k?"bg-[#8E0000]/30 text-[#ff8a99]":"text-[#a1a1aa]")}><Ic n={i} s={21}/>{l}</button>)}</div></nav>}
  {mOpen&&<div className="fixed inset-0 z-[60]"><div className="absolute inset-0 bg-black/60" onClick={()=>setMOpen(false)}/>

class EB extends React.Component{constructor(p){super(p);this.state={e:null,info:""}}

   <pre style={{whiteSpace:"pre-wrap",color:"#EF6A78",marginTop:16,fontSize:11}}>{txt.slice(0,1500)}</pre></div>}}
